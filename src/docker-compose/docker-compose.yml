version: "3.8"

services:
  redis:
    # redis:5 已停止维护（EOL 无安全补丁），升级到 7.x
    image: redis:7
    container_name: redis
    restart: always
    # 密码必填：不再提供 123456 默认值，未配置时 compose 直接拒绝启动
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    expose:
      - "6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      # requirepass 下必须带 -a 认证，否则 redis-cli ping 返回 NOAUTH 导致永远 unhealthy
      test: [ "CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mysql:
    # mysql:5.7 已于 2023-10 EOL，升级到 8.0。
    # 注意：如 ./mysql/datadir 已有 5.7 数据卷，需先按官方流程做原地升级
    # （8.0 容器首次启动会自动执行升级检查），或导出/导入重建数据卷。
    # 保留 mysql_native_password 以兼容 mysqlclient / goinception 备份链路。
    image: mysql:8.0
    container_name: mysql
    restart: always
    command:
      - --default-authentication-plugin=mysql_native_password
    # 默认只绑定本机，避免同网段绕过 Archery 直连数据库；确需远程访问请走 SSH 隧道
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - "./mysql/my.cnf:/etc/mysql/my.cnf"
      - "./mysql/datadir:/var/lib/mysql"
    environment:
      MYSQL_DATABASE: archery
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    healthcheck:
      # 走 TCP 而非默认 socket：初始化阶段 socket 可用会造成健康假阳性
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent" ]
      interval: 5s
      timeout: 5s
      retries: 5

  goinception:
    image: hanchuanchuan/goinception
    container_name: goinception
    restart: always
    # 仅本机可访问，避免任意来源直接提交审核/执行
    ports:
      - "127.0.0.1:${GOINCEPTION_HOST_PORT:-4000}:4000"
    volumes:
      - "./inception/config.toml:/etc/config.toml"

  dbshield:
    # 默认使用本仓库 Dockerfile 构建的镜像（应用位于 /opt/dbshield）：
    #   docker build -f src/docker/Dockerfile -t dbshield-vue3:v1 .
    # 若改用上游 hhyo/archery 镜像（应用位于 /opt/archery），
    # 需同步把下方挂载路径与 entrypoint 改回 /opt/archery/...
    # 上游镜像参考: dockerhub https://hub.docker.com/r/hhyo/archery
    image: dbshield-vue3:v1
    container_name: dbshield
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-9123}:9123"
    volumes:
      - "./.env:/opt/dbshield/.env"
      - "./dbshield/soar.yaml:/etc/soar.yaml"
      - "./dbshield/docs.md:/opt/dbshield/docs/docs.md"
      - "./dbshield/downloads:/opt/dbshield/downloads"
      # 不挂载 sql/migrations：宿主目录不存在时 Docker 会自动创建空目录，
      # 反而遮蔽镜像内自带的迁移文件导致容器内 migrate 失效
      - "./dbshield/logs:/opt/dbshield/logs"
      - "./dbshield/keys:/opt/dbshield/keys"
    environment:
      # 显式覆盖 .env 中的旧值：密码统一从必填变量生成，避免残留默认密码。
      # 注意：密码请使用 URL 安全字符（或做 percent-encoding），否则 DATABASE_URL 解析会失败。
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}@mysql:3306/archery
      CACHE_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
    security_opt:
      - no-new-privileges:true
    entrypoint: "bash /opt/dbshield/src/docker/startup.sh"
    env_file:
      - .env

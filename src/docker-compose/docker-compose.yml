version: '3'

services:
  redis:
    image: redis:5
    container_name: redis
    restart: always
    command: redis-server --requirepass 123456
    expose:
      - "6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:5.7
    container_name: mysql
    restart: always
    ports:
      - "3306:3306"
    volumes:
      - "./mysql/my.cnf:/etc/mysql/my.cnf"
      - "./mysql/datadir:/var/lib/mysql"
    environment:
      MYSQL_DATABASE: archery
      MYSQL_ROOT_PASSWORD: 123456
    healthcheck:
      test: ["CMD", "mysqladmin", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  goinception:
    image: hanchuanchuan/goinception
    container_name: goinception
    restart: always
    ports:
      - "4000:4000"
    volumes:
      - "./inception/config.toml:/etc/config.toml"

  dbshield:
    # 默认使用本仓库 Dockerfile 构建的镜像（应用位于 /opt/dbshield）：
    #   docker build -f src/docker/Dockerfile -t dbshield-vue3:v1 .
    # 若改用上游 hhyo/archery 镜像（应用位于 /opt/archery），
    # 需同步把下方挂载路径与 entrypoint 改回 /opt/archery/...
    # 上游镜像参考: dockerhub https://hub.docker.com/r/hhyo/archery
    image: dbshield-vue3:v1
    container_name: dbshield
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    ports:
      - "9123:9123"
    volumes:
      - "./.env:/opt/dbshield/.env"
      - "./dbshield/soar.yaml:/etc/soar.yaml"
      - "./dbshield/docs.md:/opt/dbshield/docs/docs.md"
      - "./dbshield/downloads:/opt/dbshield/downloads"
      - "./dbshield/sql/migrations:/opt/dbshield/sql/migrations"
      - "./dbshield/logs:/opt/dbshield/logs"
      - "./dbshield/keys:/opt/dbshield/keys"
    entrypoint: "bash /opt/dbshield/src/docker/startup.sh"
    env_file:
      - .env
